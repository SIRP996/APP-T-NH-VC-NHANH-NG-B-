
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Link2Ink Studio - Công cụ tính giá</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script type="importmap">
    {
      "imports": {
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
        "react/": "https://aistudiocdn.com/react@^19.2.0/",
        "react": "https://aistudiocdn.com/react@^19.2.0"
      }
    }
    </script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <!-- SheetJS (xlsx) library for Excel file parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
                slate: {
                    750: '#2d3748', 
                    850: '#1e293b', 
                    900: '#0f172a',
                    950: '#020617', 
                },
                primary: {
                    50: 'rgb(var(--primary-50) / <alpha-value>)',
                    100: 'rgb(var(--primary-100) / <alpha-value>)',
                    200: 'rgb(var(--primary-200) / <alpha-value>)',
                    300: 'rgb(var(--primary-300) / <alpha-value>)',
                    400: 'rgb(var(--primary-400) / <alpha-value>)',
                    500: 'rgb(var(--primary-500) / <alpha-value>)',
                    550: 'rgb(var(--primary-550) / <alpha-value>)',
                    600: 'rgb(var(--primary-600) / <alpha-value>)',
                    700: 'rgb(var(--primary-700) / <alpha-value>)',
                    800: 'rgb(var(--primary-800) / <alpha-value>)',
                    900: 'rgb(var(--primary-900) / <alpha-value>)',
                    950: 'rgb(var(--primary-950) / <alpha-value>)',
                },
                secondary: {
                    400: 'rgb(var(--secondary-400) / <alpha-value>)',
                    500: 'rgb(var(--secondary-500) / <alpha-value>)',
                    600: 'rgb(var(--secondary-600) / <alpha-value>)',
                    900: 'rgb(var(--secondary-900) / <alpha-value>)',
                }
            },
            backgroundImage: {
              'glass-gradient': 'linear-gradient(180deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.02) 100%)',
              'gradient-radial': 'radial-gradient(var(--tw-gradient-stops))',
              'hero-glow': 'conic-gradient(from 180deg at 50% 50%, var(--tw-gradient-stops))',
            },
            boxShadow: {
              'glass': '0 4px 30px rgba(0, 0, 0, 0.1)',
              'glass-inset': 'inset 0 0 0 1px rgba(255, 255, 255, 0.08)',
              'glow-sm': '0 0 10px rgb(var(--primary-500) / 0.3)',
              'glow-lg': '0 0 30px rgb(var(--primary-500) / 0.4)',
              'glow-hover': '0 0 20px rgb(var(--primary-500) / 0.4)',
              'glow-card': '0 0 30px -5px rgb(var(--primary-500) / 0.3)',
              'glow-inset': 'inset 0 0 20px rgb(var(--primary-500) / 0.2)',
            },
            animation: {
                'float': 'float 6s ease-in-out infinite',
                'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
            keyframes: {
                float: {
                    '0%, 100%': { transform: 'translateY(0)' },
                    '50%': { transform: 'translateY(-10px)' },
                }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        /* Default Violet Theme */
        --primary-50: 245 243 255;
        --primary-100: 237 233 254;
        --primary-200: 221 214 254;
        --primary-300: 196 181 253;
        --primary-400: 167 139 250;
        --primary-500: 139 92 246;
        --primary-550: 124 58 237;
        --primary-600: 124 58 237;
        --primary-700: 109 40 217;
        --primary-800: 91 33 182;
        --primary-900: 76 29 149;
        --primary-950: 46 16 101;

        --secondary-400: 232 121 249; /* Fuchsia 400 */
        --secondary-500: 217 70 239;  /* Fuchsia 500 */
        --secondary-600: 192 38 211;  /* Fuchsia 600 */
        --secondary-900: 112 26 117;  /* Fuchsia 900 */
      }

      [data-theme='green'] {
        /* Green/Emerald Theme */
        --primary-50: 236 253 245;
        --primary-100: 209 250 229;
        --primary-200: 167 243 208;
        --primary-300: 110 231 183;
        --primary-400: 52 211 153;
        --primary-500: 16 185 129;
        --primary-550: 5 150 105;
        --primary-600: 5 150 105;
        --primary-700: 4 120 87;
        --primary-800: 6 95 70;
        --primary-900: 6 78 59;
        --primary-950: 2 44 34;

        --secondary-400: 56 189 248; /* Sky 400 */
        --secondary-500: 14 165 233; /* Sky 500 */
        --secondary-600: 2 132 199;  /* Sky 600 */
        --secondary-900: 12 74 110;  /* Sky 900 */
      }

      [data-theme='grey'] {
        /* Grey / Apple-esque Theme (Zinc Scale) */
        --primary-50: 250 250 250;
        --primary-100: 244 244 245;
        --primary-200: 228 228 231;
        --primary-300: 212 212 216;
        --primary-400: 161 161 170;
        --primary-500: 113 113 122; /* Zinc 500 */
        --primary-550: 82 82 91;
        --primary-600: 63 63 70;    /* Zinc 700 */
        --primary-700: 39 39 42;
        --primary-800: 24 24 27;
        --primary-900: 24 24 27;    /* Zinc 800 */
        --primary-950: 9 9 11;

        --secondary-400: 148 163 184; /* Slate 400 */
        --secondary-500: 100 116 139; /* Slate 500 */
        --secondary-600: 71 85 105;   /* Slate 600 */
        --secondary-900: 15 23 42;    /* Slate 900 */
      }

      [data-theme='neon-blue'] {
        /* Black & Neon Blue Theme (High Contrast) */
        --primary-50: 224 248 255;
        --primary-100: 207 250 254;
        --primary-200: 165 243 252;
        --primary-300: 103 232 249;
        --primary-400: 34 211 238;
        --primary-500: 6 182 212;   /* Cyan 500 */
        --primary-550: 8 145 178;
        --primary-600: 8 145 178;   /* Cyan 600 */
        --primary-700: 14 116 144;
        --primary-800: 21 94 117;
        --primary-900: 0 0 0;       /* Pitch Black Accent */
        --primary-950: 0 0 0;

        --secondary-400: 96 165 250; /* Blue 400 */
        --secondary-500: 59 130 246; /* Blue 500 */
        --secondary-600: 37 99 235;  /* Blue 600 */
        --secondary-900: 30 58 138;
      }

      /* Milk White Theme Configuration */
      [data-theme='milk-white'] {
        --primary-50: 248 250 252;
        --primary-100: 241 245 249;
        --primary-200: 226 232 240;
        --primary-300: 203 213 225;
        --primary-400: 148 163 184;
        --primary-500: 79 70 229; /* Indigo 600 - Standard brand color */
        --primary-550: 67 56 202;
        --primary-600: 67 56 202;
        --primary-700: 55 48 163;
        --primary-800: 49 46 129;
        --primary-900: 30 27 75;
        --primary-950: 17 24 39;

        --secondary-400: 167 139 250; 
        --secondary-500: 139 92 246;
        --secondary-600: 124 58 237;
        --secondary-900: 76 29 149;
      }

      body {
        /* Base Dark Mode */
        background-color: #0f172a; 
        color: #e2e8f0;
        background-image: 
            radial-gradient(circle at 15% 50%, rgb(var(--primary-900) / 0.15), transparent 25%), 
            radial-gradient(circle at 85% 30%, rgb(var(--secondary-900) / 0.15), transparent 25%);
        min-height: 100vh;
        font-family: 'Inter', sans-serif;
        transition: background-image 0.5s ease, background-color 0.5s ease;
      }
      
      /* Neon Theme Body */
      [data-theme='neon-blue'] body {
         background-color: #000000;
         color: #ecfeff;
         background-image: 
            radial-gradient(circle at 20% 50%, rgba(6, 182, 212, 0.15), transparent 30%), 
            radial-gradient(circle at 80% 20%, rgba(59, 130, 246, 0.15), transparent 30%);
      }

      /* 
       * MILK WHITE THEME OVERRIDES 
       * Aggressive overrides to force light mode visuals on dark-coded components 
       */
      [data-theme='milk-white'] body {
          background-color: #f1f5f9; /* Slate 100 Background */
          background-image: none;
          color: #0f172a; /* Slate 900 Text */
      }

      /* 1. TEXT COLOR OVERRIDES - FORCE DARK TEXT */
      [data-theme='milk-white'] .text-white,
      [data-theme='milk-white'] .text-slate-50,
      [data-theme='milk-white'] .text-slate-100,
      [data-theme='milk-white'] .text-slate-200,
      [data-theme='milk-white'] .text-slate-300 {
          color: #0f172a !important; /* Force to dark blue-black */
      }

      [data-theme='milk-white'] .text-slate-400 {
          color: #475569 !important; /* Darker slate for readability */
      }
      
      [data-theme='milk-white'] .text-slate-500 {
          color: #64748b !important;
      }

      /* Primary text colors that are too light on white */
      [data-theme='milk-white'] .text-primary-200,
      [data-theme='milk-white'] .text-primary-300 {
          color: #4338ca !important; /* Indigo 700 */
      }

      /* 2. BACKGROUND & TRANSPARENCY REMOVAL */
      
      /* Glass Panel - Solid White, No Blur */
      [data-theme='milk-white'] .glass-panel {
          background: #ffffff !important;
          backdrop-filter: none !important;
          border: 1px solid #e2e8f0 !important;
          box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06) !important;
      }

      /* Glass Input - Solid White with Border */
      [data-theme='milk-white'] .glass-input,
      [data-theme='milk-white'] input, 
      [data-theme='milk-white'] textarea, 
      [data-theme='milk-white'] select {
          background-color: #ffffff !important;
          background-image: none !important; 
          border: 1px solid #cbd5e1 !important; /* Slate 300 Border */
          color: #0f172a !important;
          box-shadow: inset 0 1px 2px rgba(0,0,0,0.05) !important;
      }
      
      [data-theme='milk-white'] .glass-input:focus,
      [data-theme='milk-white'] input:focus {
          border-color: #6366f1 !important; /* Indigo 500 */
          box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1) !important;
          background-color: #ffffff !important;
      }
      
      [data-theme='milk-white'] input::placeholder {
          color: #94a3b8 !important;
      }

      /* Invert Dark Backgrounds to Light/White */
      [data-theme='milk-white'] .bg-slate-950,
      [data-theme='milk-white'] .bg-slate-900,
      [data-theme='milk-white'] .bg-slate-800,
      [data-theme='milk-white'] .bg-\[\#0f172a\] {
          background-color: #ffffff !important;
          border-color: #e2e8f0 !important;
          color: #0f172a !important;
      }
      
      /* Semi-transparent backgrounds -> Solid Light Grey */
      [data-theme='milk-white'] .bg-slate-900\/30,
      [data-theme='milk-white'] .bg-slate-900\/40,
      [data-theme='milk-white'] .bg-slate-900\/50,
      [data-theme='milk-white'] .bg-slate-900\/80,
      [data-theme='milk-white'] .bg-slate-900\/90 {
          background-color: #f8fafc !important; /* Slate 50 */
          border: 1px solid #e2e8f0 !important;
          color: #0f172a !important;
          backdrop-filter: none !important;
      }
      
      /* Result Box Inner Container Override */
      [data-theme='milk-white'] .bg-slate-950\/90 {
           background-color: #ffffff !important;
           border: 1px solid #e2e8f0 !important;
      }

      /* 3. BORDERS & DIVIDERS */
      [data-theme='milk-white'] .border-white\/5,
      [data-theme='milk-white'] .border-white\/10,
      [data-theme='milk-white'] .border-slate-800,
      [data-theme='milk-white'] .border-slate-700,
      [data-theme='milk-white'] .border-slate-800\/50 {
          border-color: #cbd5e1 !important;
      }
      
      [data-theme='milk-white'] .divide-slate-800\/50 > * + * {
          border-color: #e2e8f0 !important;
      }

      /* 4. TABLE STYLES */
      [data-theme='milk-white'] thead tr th {
          background-color: #f1f5f9 !important;
          color: #475569 !important;
          border-bottom: 2px solid #e2e8f0 !important;
      }
      
      /* Sticky columns in white mode need solid background */
      [data-theme='milk-white'] .sticky {
          background-color: #ffffff !important;
          border-right: 1px solid #e2e8f0 !important;
      }
      [data-theme='milk-white'] thead .sticky {
          background-color: #f1f5f9 !important;
      }

      /* Selected Row - Needs Contrast */
      [data-theme='milk-white'] tr.bg-primary-500\/20 {
          background-color: #e0e7ff !important; /* Indigo 100 */
          box-shadow: none !important;
          border-bottom: 1px solid #c7d2fe !important;
      }
      [data-theme='milk-white'] tr.bg-primary-500\/20 td {
          color: #312e81 !important; /* Indigo 900 */
      }
      [data-theme='milk-white'] tr.bg-primary-500\/20 .sticky {
          background-color: #e0e7ff !important;
          color: #312e81 !important;
      }

      /* 5. INTERACTIVE ELEMENTS */
      [data-theme='milk-white'] button.text-slate-400:hover {
          background-color: #f1f5f9 !important;
          color: #0f172a !important;
      }
      
      /* Toggle Switches */
      [data-theme='milk-white'] .bg-slate-700 {
          background-color: #cbd5e1 !important; /* Light grey for "off" state */
      }
      
      /* Hover States */
      [data-theme='milk-white'] .hover\:bg-slate-800:hover,
      [data-theme='milk-white'] .hover\:bg-slate-900:hover,
      [data-theme='milk-white'] .hover\:bg-white\/10:hover {
          background-color: #f1f5f9 !important;
      }

      /* Scrollbar Visibility */
      [data-theme='milk-white'] ::-webkit-scrollbar-thumb {
          background: #94a3b8; /* Visible grey scrollbar */
      }
      [data-theme='milk-white'] ::-webkit-scrollbar-track {
          background: #f1f5f9;
      }
    </style>
</head>
<body class="antialiased selection:bg-primary-500/30 selection:text-primary-100">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
